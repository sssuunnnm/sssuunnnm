name: generate 3d contribution graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: prepare output-3d branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin output-3d:output-3d 2>/dev/null || true
          if git show-ref --quiet refs/heads/output-3d; then
            git checkout -B output-3d origin/output-3d
          else
            git checkout --orphan output-3d
            git rm -rf . > /dev/null 2>&1 || true
            git commit --allow-empty -m "init output-3d branch"
            git push origin output-3d
          fi

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: commit & push
        run: |
          git add -A .
          if git commit -m "generated"; then
            git push origin output-3d
          fi
