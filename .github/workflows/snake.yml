name: generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%232B3A55&color_dots=%23EAF6FF,%23CFE8FF,%239CD1FF,%236EC1E4,%234A7FC1
            dist/github-contribution-grid-snake-dark.svg?color_snake=%232B3A55&color_dots=%23EAF6FF,%23CFE8FF,%239CD1FF,%236EC1E4,%234A7FC1

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
